<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大小周排班表 - Apple日历订阅</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 500px; text-align: center; }
        h1 { color: #1d1d1f; font-size: 24px; margin-bottom: 10px; }
        p { color: #6e6e73; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .btn { display: inline-block; background: #007aff; color: white; text-decoration: none; padding: 12px 30px; border-radius: 10px; font-size: 16px; font-weight: 600; transition: background 0.2s; margin: 10px 5px; }
        .btn:hover { background: #0056b3; }
        .btn-secondary { background: #5ac8fa; }
        .btn-secondary:hover { background: #009ee0; }
        .note { background: #f0f0f0; border-radius: 10px; padding: 15px; margin-top: 20px; font-size: 12px; color: #86868b; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h1>大小周排班表</h1>
        <p>2026年 大小周排班日历订阅</p>
        <p>点击下方按钮即可将排班日历添加到Apple日历</p>
        
        <!-- 
            使用说明：
            1. 将此HTML文件和.ics文件上传到任意Web服务器
            2. 将下面的 webcal://localhost/sizeweek_2026.ics 替换为你的实际URL
            3. 用户在Safari中点击链接即可订阅
        -->
        <a href="webcal://localhost/sizeweek_2026.ics" class="btn">添加到Apple日历</a>
        <a href="sizeweek_2026.ics" class="btn btn-secondary" download>下载.ics文件</a>
        
        <div class="note">
            <p><strong>部署说明：</strong></p>
            <p>1. 将本HTML文件和 sizeweek_2026.ics 上传到Web服务器</p>
            <p>2. 修改HTML中的 webcal:// 链接为你的实际服务器地址</p>
            <p>3. 确保服务器正确返回 .ics 文件的 Content-Type: text/calendar</p>
            <p>4. 用户通过Safari浏览器打开HTML页面，点击按钮即可订阅</p>
            <p>5. 也可使用 iCloud、Google Calendar 等支持ICS格式的服务</p>
        </div>
    </div>
</body>
</html>
